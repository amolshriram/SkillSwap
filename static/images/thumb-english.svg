<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b45309" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5624d0" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1200" height="450" fill="#ffffff"/>
  <rect width="1200" height="450" fill="url(#g)"/>

  <circle cx="260" cy="320" r="210" fill="#b45309" opacity="0.12" filter="url(#blur)"/>
  <circle cx="950" cy="110" r="160" fill="#5624d0" opacity="0.12" filter="url(#blur)"/>

  <!-- abstract chat bubbles -->
  <g transform="translate(740 120)" opacity="0.26" fill="#111827">
    <path d="M40 0h320c22 0 40 18 40 40v70c0 22-18 40-40 40H150l-60 46v-46H40c-22 0-40-18-40-40V40C0 18 18 0 40 0z" fill-opacity="0.10" stroke="#111827" stroke-opacity="0.14"/>
    <rect x="34" y="28" width="240" height="16" rx="8" fill-opacity="0.18"/>
    <rect x="34" y="56" width="190" height="16" rx="8" fill-opacity="0.12"/>
  </g>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" fill="#111827">
    <text x="70" y="110" font-size="44" font-weight="800" letter-spacing="-0.5">English</text>
    <text x="70" y="155" font-size="24" font-weight="600" opacity="0.72">Speak confidently</text>
  </g>

  <g transform="translate(930 70)">
    <rect x="0" y="0" rx="18" ry="18" width="200" height="68" fill="#ffffff" opacity="0.86" stroke="#e5e7eb"/>
    <text x="24" y="44" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="22" font-weight="800" fill="#b45309">Popular</text>
  </g>
