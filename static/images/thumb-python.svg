    <path d="M700 180 C 780 110, 860 260, 950 190 S 1100 200, 1160 150" fill="none" stroke="#111827" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" fill="#111827">
    <text x="70" y="110" font-size="44" font-weight="800" letter-spacing="-0.5">Python</text>
