      <stop offset="0" stop-color="#5624d0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1f8f6b" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="r" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#5624d0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5624d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
