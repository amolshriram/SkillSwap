<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f8f6b" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#5624d0" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="450" fill="#ffffff"/>
  <rect width="1200" height="450" fill="url(#g)"/>

  <circle cx="260" cy="280" r="190" fill="#1f8f6b" opacity="0.14" filter="url(#blur)"/>
  <circle cx="940" cy="130" r="150" fill="#5624d0" opacity="0.16" filter="url(#blur)"/>

  <!-- abstract guitar silhouette -->
  <g transform="translate(780 190)" opacity="0.18">
    <path d="M120 10c-30 0-55 25-55 55 0 14 5 28 14 38l-36 68c-6 10-2 22 8 28l20 12c10 6 22 2 28-8l36-68c4 1 9 1 13 1 30 0 55-25 55-55S150 10 120 10z" fill="#111827"/>
    <rect x="-5" y="5" width="150" height="12" rx="6" fill="#111827"/>
  </g>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" fill="#111827">
    <text x="70" y="110" font-size="44" font-weight="800" letter-spacing="-0.5">Guitar</text>
    <text x="70" y="155" font-size="24" font-weight="600" opacity="0.72">Play your first songs</text>
  </g>

  <g transform="translate(930 70)">
    <rect x="0" y="0" rx="18" ry="18" width="200" height="68" fill="#ffffff" opacity="0.86" stroke="#e5e7eb"/>
    <text x="24" y="44" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="22" font-weight="800" fill="#1f8f6b">Beginner</text>
  </g>
</svg>
