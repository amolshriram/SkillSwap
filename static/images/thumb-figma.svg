<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#5624d0" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="450" fill="#ffffff"/>
  <rect width="1200" height="450" fill="url(#g)"/>

  <circle cx="270" cy="140" r="160" fill="#5624d0" opacity="0.14" filter="url(#blur)"/>
  <circle cx="880" cy="330" r="200" fill="#1f8f6b" opacity="0.10" filter="url(#blur)"/>

  <!-- abstract UI blocks -->
  <g transform="translate(720 90)" opacity="0.28" fill="#111827">
    <rect x="0" y="0" width="380" height="260" rx="18" fill-opacity="0.10" stroke="#111827" stroke-opacity="0.14"/>
    <rect x="26" y="28" width="210" height="18" rx="9" fill-opacity="0.22"/>
    <rect x="26" y="64" width="320" height="110" rx="14" fill-opacity="0.14"/>
    <rect x="26" y="190" width="130" height="40" rx="12" fill-opacity="0.18"/>
    <rect x="170" y="190" width="176" height="40" rx="12" fill-opacity="0.10"/>
  </g>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" fill="#111827">
    <text x="70" y="110" font-size="44" font-weight="800" letter-spacing="-0.5">UI/UX</text>
    <text x="70" y="155" font-size="24" font-weight="600" opacity="0.72">Figma workflows</text>
  </g>

  <g transform="translate(930 70)">
    <rect x="0" y="0" rx="18" ry="18" width="200" height="68" fill="#ffffff" opacity="0.86" stroke="#e5e7eb"/>
    <text x="24" y="44" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="22" font-weight="800" fill="#5624d0">Intermediate</text>
  </g>
</svg>
